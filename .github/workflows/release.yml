name: Release to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch: {}

# Maven Central publishing (verified against Sonatype docs, 2026):
#   - auth  = Central Portal USER TOKEN (no OIDC trusted-publishing for Maven).
#   - sign  = GPG/PGP (.asc) REQUIRED; Sigstore is optional add-on, does NOT replace GPG.
#   - this project's GPG key is passphrase-LESS (verified) -> only 3 secrets needed:
#       MAVEN_GPG_PRIVATE_KEY, CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD.

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign, deploy
    runs-on: ubuntu-latest
    # Optional manual approval gate before any publish happens (create this
    # environment + "required reviewers" in repo Settings > Environments).
    environment: production
    steps:
      - name: Checkout (the release tag's commit)
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Guard - pom version must be a release and match the tag
        shell: bash
        run: |
          set -euo pipefail
          # On a release event GITHUB_REF_NAME is the tag; on manual dispatch it is the branch.
          VERSION=$(mvn -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          echo "project.version=${VERSION}"
          case "$VERSION" in
            *SNAPSHOT*) echo "::error::refusing to publish a -SNAPSHOT version"; exit 1;;
          esac
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
            echo "release tag=${TAG}"
            if [ "$VERSION" != "$TAG" ]; then
              echo "::error::pom version ($VERSION) != release tag ($TAG)"; exit 1
            fi
          fi

      - name: Import GPG signing key (passphrase-less)
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          gpg --list-secret-keys --with-colons | sed -n 's/^sec:/sec:/p'
          # The signing key has NO passphrase (verified locally), so signing is
          # non-interactive on the runner. allow-loopback is kept as a belt-and-suspenders.
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true

      - name: Render ~/.m2/settings.xml (Central token only; no gpg passphrase)
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_USERNAME}</username>
                <password>${CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build, GPG-sign, deploy to Central (autoPublish=true)
        run: mvn -B -ntp -Pdeploy -Dgpg.pinentry-mode=loopback clean deploy
